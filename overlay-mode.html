<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Theme</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; height: 100%; border-radius: 50%;
    display: grid; place-items: center; color: #1c1d23;
    background: radial-gradient(circle at 50% 30%, #fffaf0, #efe6d3 75%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.16); }
  button:hover { filter: brightness(1.06); }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 2px solid #1c1d23; outline-offset: -5px; }
  svg { width: 22px; height: 22px; }
  .moon { display: none; }
  [data-theme="light"] .sun { display: none; }
  [data-theme="light"] .moon { display: block; }
</style>
</head>
<body>
  <button id="t" title="Switch to light theme" aria-label="Switch to light theme">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>
  </button>
  <script src="overlay-mode.js"></script>
</body>
</html>
